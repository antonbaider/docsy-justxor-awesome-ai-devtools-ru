name: Проверка ссылок

on:
  schedule:
    - cron: "23 5 * * 1"   # по понедельникам
  workflow_dispatch:
  pull_request:
    paths: ["**.md"]

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить ссылки
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 30 --max-retries 2
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,429
            --exclude-mail
            './**/*.md'
          fail: false
      - name: Создать issue со сломанными ссылками
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Сломанные ссылки (автопроверка)"
          content-filepath: ./lychee/out.md
          labels: ошибка
